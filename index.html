<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <title>Bezierizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>
  <input type="file" id="importBGInput" accept=".jpg,.jpeg,.png" style="display:none" />
  <input type="file" id="importFigureInput" accept=".json" style="display:none" />
  <div id="editor" class="p-4 bg-white rounded-4 shadow">
    <div class="d-flex justify-content-center mb-3 gap-2">
      <h1 class="title">Bezierizer</h1>
    </div>
    <div id="multiplayerDiv" class="mb-3">
      <div class="mb-2">Your ID:&nbsp;
        <span id="myPeerId" style="font-weight: bold; font-size: xx-large;"></span>
        <button id="copyPeerIdBtn" class="btn btn-outline-secondary btn-sm ms-2" title="Copy ID">
          <i class='bi bi-copy'></i>
        </button>
      </div>
      <div class="mb-2">Partner's ID:&nbsp;
        <span id="partnersPeerId"></span>
      </div>
      <div id="peerPanel">
        <input id="peerIdInput" class="form-control mb-2" placeholder="Enter Host's ID" maxlength="6">
        <button id="connectBtn" class="btn btn-primary">Connect</button>
      </div>
      <div id="hostPanel" style="display:none">
        <div id="addBgMsg" class="mb-2">Background:</div>
        <div id="addBgDiv" class="mb-2">
          <button id="addBgBtn" class="btn btn-outline-primary btn-sm ms-2">Add</button>
          <div id="bgDropArea" class="border rounded p-2 mt-2" style="min-height:72px; background:#f8f9fa;">Drop images here</div>
        </div>
        <div id="bgImageButtons" class="d-flex justify-content-center mb-3 gap-2"></div>
      </div>
      <div id="mpMsg" class="d-flex justify-content-center mb-3 gap-2" style="font-size: x-large;"></div>
      <div id="guessDiv" class="d-flex justify-content-center mb-3 gap-2" id="guessDiv" class="mt-3">
        <div id="guessImgBtns" class="d-flex gap-2 mb-2"></div>
      </div>
    </div>
    <div id="commonDiv">
      <div class="d-flex justify-content-center mb-3 gap-2">
        <button id="importBGBtn" class="btn btn-primary px-4" title="Import Background File (.jpeg/.jpg/.png)"><i
            class="bi bi-plus-circle"></i>&nbsp;Background</button>
        <button id="importFigureBtn" class="btn btn-primary px-4" title="Import Figure Data (.json)"><i
            class="bi bi-plus-circle"></i>&nbsp;Figure</button>
        <button id="exportFigureBtn" class="btn btn-outline-primary px-4" title="Export Figure Data (.json)"><i
            class="bi bi-download"></i>&nbsp;Figure</button>
        <button id="exportSvgBtn" class="btn btn-outline-primary px-4" title="Export Canvas Image (.svg)"><i
            class="bi bi-download"></i>&nbsp;Canvas</button>
        <button id="copyPngBtn"
          class="btn btn-outline-primary rounded-circle d-flex align-items-center justify-content-center"
          style="width:48px;height:48px;" title="Copy Canvas Image (.png)"><i class="bi bi-copy"></i></button>
        <button id="shareBtn"
          class="btn btn-outline-primary rounded-circle d-flex align-items-center justify-content-center"
          style="width:48px;height:48px;" title="Share"><i class="bi bi-share"></i></button>
      </div>
      <div class="text-center mb-2">
        <div id="showScore" class="mb-2 fw-bold" style="font-size:1.2rem;">0.0 %</div>
        <div id="showMoveCount" class="mb-2 fw-bold" style="font-size:1.2rem;">Move Count 0</div>
      </div>
      <div id="canvasDiv" style="position:relative;margin:auto;">
        <canvas id="bgCanvas"
          style="position:absolute;left:0;top:0;z-index:0;display:none;visibility:hidden;"></canvas>
        <svg id="svg" class="border rounded-3 shadow-sm" style="position:absolute;left:0;top:0;z-index:1">
          <path id="mainBezier" class="bezier" />
        </svg>
      </div>
      <div id="anchorsDiv" class="d-flex justify-content-center align-items-center gap-2 mt-3">
        <label for="anchorCountSlider" class="me-2">Anchors:</label>
        <input type="range" id="anchorCountSlider" style="width:240px;" class="form-range">
        <input type="number" id="anchorCountInput" style="width:80px;" class="form-control">
      </div>
    </div>
    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;"></div>
    <!-- Share Dialog -->
    <div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="shareModalLabel">Share</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-flex justify-content-center gap-3">
            <button id="shareXBtn" class="btn btn-dark rounded-circle d-flex align-items-center justify-content-center"
              style="width:48px;height:48px;" title="Share to X"><i class="bi bi-twitter-x"
                style="font-size:1.5rem;"></i></button>
            <!-- <button id="shareInstagramBtn" class="btn btn-danger rounded-circle d-flex align-items-center justify-content-center" style="width:48px;height:48px;" title="Share to Instagram"><i class="bi bi-instagram" style="font-size:1.5rem;"></i></button> -->
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Mode Select Dialog -->
  <div class="modal fade" id="modeSelectModal" tabindex="-1" aria-labelledby="modeSelectLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modeSelectLabel">Select Mode</h5>
        </div>
        <div class="modal-body d-flex justify-content-center gap-3">
          <button id="singleModeBtn" class="btn btn-primary px-4">Single</button>
          <button id="multiModeBtn" class="btn btn-outline-primary px-4">Multi</button>
        </div>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
  <script src="peerjs-p2p-multiplayer.js"></script>
</body>

</html>
